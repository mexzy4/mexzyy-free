name: Zbuduj Mexzyy Free

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mexzyy-build
  cancel-in-progress: true

jobs:
  exe:
    name: Wersja na komputer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Mexzyy-Free-exe
          path: dist/Mexzyy Free 1.0.0.exe

  apk:
    name: Wersja na Androida (.apk)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Zbuduj APK
        run: |
          mkdir apkbuild
          cd apkbuild
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          cp ../index.html ../manifest.json ../icon.svg ../icon-192.png ../icon-512.png www/
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.mexzyy.free","appName":"Mexzyy Free","webDir":"www"}
          EOF
          npx cap add android
          find android/app/src/main/res -name 'ic_launcher*.png' -exec cp ../icon-512.png {} \;
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Mexzyy-Free-apk
          path: apkbuild/android/app/build/outputs/apk/debug/app-debug.apk

  site:
    name: Strona z pobieraniem
    needs: [exe, apk]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Mexzyy-Free-exe
          path: dl-exe
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Mexzyy-Free-apk
          path: dl-apk
      - name: Zloz strone
        run: |
          mkdir -p site/app
          cp download.html site/index.html
          cp icon-192.png site/
          cp index.html manifest.json sw.js icon.svg icon-192.png icon-512.png site/app/
          cp dl-apk/*.apk site/Mexzyy-Free.apk || true
          cp dl-exe/*.exe site/Mexzyy-Free.exe || true
          ls -la site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
